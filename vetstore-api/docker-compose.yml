services:
  mysql:
    image: mysql:8.4
    container_name: vetcare-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:root}
      MYSQL_DATABASE: vetcare_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  backend:
    build: .
    container_name: vetcare-api

    environment:
      DB_URL: jdbc:mysql://mysql:3306/vetcare_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:root}

      JWT_SECRET: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:CGXZLS0Z}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:XNBCJFAKAZQSGTARRLGCHVZWCIOIGSHN}
      VNPAY_PAY_URL: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      VNPAY_RETURN_URL: http://localhost:5173/vnpay-return

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy


volumes:
  mysql_data:
